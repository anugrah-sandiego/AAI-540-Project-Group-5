name: Group 5 DAG demo (no AWS)
on:
  workflow_dispatch:
    inputs:
      outcome:
        description: 'Demonstrate a successful run or a deliberate gate failure'
        type: choice
        options: [success, failure]
        default: success
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Demo validation passed; no AWS calls'
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Simulated quality gate
        env:
          OUTCOME: ${{ inputs.outcome }}
        run: |
          if [ "$OUTCOME" = failure ]; then
            echo 'Deliberate demonstration failure'
            exit 1
          fi
          echo 'Demo gate passed'
  deploy-demo:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo 'SIMULATION ONLY - deployment stage passed; no resources created'
  failure-handler:
    needs: [validate, test, deploy-demo]
    if: always() && (needs.validate.result == 'failure' || needs.test.result == 'failure' || needs.deploy-demo.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Failure recorded; downstream deployment skipped; no rollback needed'
  summary:
    needs: [validate, test, deploy-demo, failure-handler]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
