name: Group 5 CI and SageMaker release
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Train and release on AWS (creates billable resources)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: group5-${{ github.ref }}
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  AWS_BUCKET: sagemaker-us-east-1-562792440372
  AWS_ROLE_ARN: arn:aws:iam::562792440372:role/LabRole
  RAW_DATA_URI: s3://sagemaker-us-east-1-562792440372/aai540/bank-marketing/raw/bank-full.csv
  RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
  PRODUCTION_ENDPOINT: bank-marketing-production
  BASE_TRAINING_JOB_NAME: bank-marketing-training-20261011-095612
  MIN_ROC_AUC: '0.75'
  MIN_LIFT_AT_10: '2.5'
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt
      - run: python -m pip install -r cicd/requirements-ci.txt
      - run: python -m pip check
      - run: ruff check src cicd --select E9,F63,F7,F82
      - run: python -m pytest tests -v --junitxml=artifacts/tests.xml --cov=src --cov=cicd --cov-report=xml:artifacts/coverage.xml
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: ignore
  train:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt
      - run: python -m pip install -r cicd/requirements-ci.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '562792440372'
      - name: Prepare
        run: python -m cicd.release prepare
      - name: Train
        run: python -m cicd.release train
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-train
          path: artifacts/release.json
          if-no-files-found: ignore
  evaluate:
    needs: train
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt
      - run: python -m pip install -r cicd/requirements-ci.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '562792440372'
      - uses: actions/download-artifact@v4
        with:
          name: state-train
          path: artifacts
      - name: Evaluate
        run: python -m cicd.release evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-evaluate
          path: artifacts/release.json
          if-no-files-found: ignore
  register:
    needs: evaluate
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt
      - run: python -m pip install -r cicd/requirements-ci.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '562792440372'
      - uses: actions/download-artifact@v4
        with:
          name: state-evaluate
          path: artifacts
      - name: Register
        run: python -m cicd.release register
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-register
          path: artifacts/release.json
          if-no-files-found: ignore
  deploy:
    needs: register
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt
      - run: python -m pip install -r cicd/requirements-ci.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '562792440372'
      - uses: actions/download-artifact@v4
        with:
          name: state-register
          path: artifacts
      - name: Approve
        run: python -m cicd.release approve
      - name: Staging
        run: python -m cicd.release staging
      - name: Promote
        run: python -m cicd.release promote
      - name: Always clean staging resources
        if: always()
        run: |
          if [ -f artifacts/release.json ]; then
            python -m cicd.release cleanup
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-deploy
          path: artifacts/release.json
          if-no-files-found: ignore
  outcome:
    needs: [checks, train, evaluate, register, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report real job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = any(v['result'] in ('failure', 'cancelled') for v in results.values())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Job | Result |\n|---|---|\n')
              for key, value in results.items():
                  out.write(f"| {key} | {value['result']} |\n")
          if failed:
              raise SystemExit('Pipeline failed; inspect state and job logs')
          PY
