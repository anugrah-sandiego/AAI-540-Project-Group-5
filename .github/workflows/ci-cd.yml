name: Group 5 CI and SageMaker release

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      release:
        description: 'Run AWS training and deployment'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: group5-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_BUCKET: sagemaker-us-east-1-562792440372
  AWS_ROLE_ARN: arn:aws:iam::562792440372:role/LabRole
  RAW_DATA_URI: s3://sagemaker-us-east-1-562792440372/aai540/bank-marketing/raw/bank-full.csv
  RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
  PRODUCTION_ENDPOINT: bank-marketing-production
  BASE_TRAINING_JOB_NAME: bank-marketing-training-20261011-095612
  MIN_ROC_AUC: '0.75'
  MIN_LIFT_AT_10: '2.5'

jobs:
  checks:
    name: Code checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check fatal lint errors
        run: ruff check src cicd --select E9,F63,F7,F82

      - name: Run unit and mocked integration tests
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -m pytest tests -v \
            --junitxml=artifacts/tests.xml \
            --cov=src \
            --cov=cicd \
            --cov-report=xml:artifacts/coverage.xml

      - name: Save test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: ignore

  train:
    name: Prepare data and train on AWS
    needs: checks

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release))

    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '562792440372'

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check required AWS resources
        run: |
          aws s3api head-object \
            --bucket "$AWS_BUCKET" \
            --key aai540/bank-marketing/raw/bank-full.csv

          aws sagemaker describe-training-job \
            --training-job-name "$BASE_TRAINING_JOB_NAME" \
            --query '{Status:TrainingJobStatus,Image:AlgorithmSpecification.TrainingImage}' \
            --output table

          aws sagemaker list-model-package-groups \
            --max-results 1 \
            --output table

      - name: Prepare S3 training inputs
        run: python -m cicd.release prepare

      - name: Run SageMaker training
        run: python -m cicd.release train

      - name: Save training state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-train
          path: artifacts/release.json
          if-no-files-found: ignore

  evaluate:
    name: Evaluate model quality
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '562792440372'

      - name: Download training state
        uses: actions/download-artifact@v4
        with:
          name: state-train
          path: artifacts

      - name: Evaluate and enforce quality gates
        run: python -m cicd.release evaluate

      - name: Save evaluation state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-evaluate
          path: artifacts/release.json
          if-no-files-found: ignore

  register:
    name: Register evaluated model
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '562792440372'

      - name: Download evaluation state
        uses: actions/download-artifact@v4
        with:
          name: state-evaluate
          path: artifacts

      - name: Register model pending approval
        run: python -m cicd.release register

      - name: Save registration state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-register
          path: artifacts/release.json
          if-no-files-found: ignore

  deploy:
    name: Approve, test staging, and deploy production
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '562792440372'

      - name: Download registration state
        uses: actions/download-artifact@v4
        with:
          name: state-register
          path: artifacts

      - name: Approve registered model
        run: python -m cicd.release approve

      - name: Deploy staging and validate predictions
        run: python -m cicd.release staging

      - name: Promote to production with recovery handling
        run: python -m cicd.release promote

      - name: Always clean staging resources
        if: always()
        run: |
          if [ -f artifacts/release.json ]; then
            python -m cicd.release cleanup
          fi

      - name: Save deployment state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-deploy
          path: artifacts/release.json
          if-no-files-found: ignore

  outcome:
    name: Report pipeline outcome
    needs: [checks, train, evaluate, register, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report actual job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          failed = any(
              value["result"] in ("failure", "cancelled")
              for value in results.values()
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("| Job | Result |\n|---|---|\n")
              for name, value in results.items():
                  output.write(f"| {name} | {value['result']} |\n")

          if failed:
              raise SystemExit(
                  "Pipeline failed; inspect the failed job and saved state."
              )
          PY