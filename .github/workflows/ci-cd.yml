# Real AWS workflow for Group5_Original_Modules_CICD_Fix(1).zip.
# Requires the ZIP's CI adapters AND the existing cicd/ release package.
name: Group 5 - Tests and Real AWS SageMaker Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Run real AWS operations on main (creates billable resources)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: group5-real-aws-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GROUP5_CI: '1'
  AWS_ACCOUNT_ID: '562792440372'
  AWS_REGION: us-east-1
  AWS_BUCKET: sagemaker-us-east-1-562792440372
  AWS_ROLE_ARN: arn:aws:iam::562792440372:role/LabRole
  RAW_DATA_URI: s3://sagemaker-us-east-1-562792440372/aai540/bank-marketing/raw/bank-full.csv
  FEATURE_GROUP_NAME: bank-marketing-features
  FEATURE_INGEST_WORKERS: '4'
  RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
  BASE_TRAINING_JOB_NAME: bank-marketing-training-20261017-130734
  # Optional repository variable; leave empty to use the reference job's image.
  TRAINING_IMAGE_URI: ${{ vars.TRAINING_IMAGE_URI }}
  PRODUCTION_ENDPOINT: bank-marketing-production
  MIN_ROC_AUC: '0.75'
  MIN_LIFT_AT_10: '2.5'

jobs:
  checks:
    name: Pytest and code validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Verify required files and original-module CI adapters
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "cicd/requirements-ci.txt",
              "cicd/release.py",
              "cicd/container/train.py",
              "cicd/container/inference.py",
              "cicd/container/requirements.txt",
              "src/aws/sagemaker/ci_entrypoints.py",
              "data/raw/bank-full.csv",
              "tests/cicd/test_release.py",
              "tests/cicd/test_original_cli.py",
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit("Missing required project files: " + ", ".join(missing))
          for name in ("feature_store", "training", "model_registry", "deployment"):
              path = Path(f"src/aws/sagemaker/{name}.py")
              source = path.read_text()
              if "GROUP5_CI" not in source or "ci_entrypoints" not in source:
                  raise SystemExit(
                      f"{path} lacks the ZIP's CI adapter. Restore that file from "
                      "Group5_Original_Modules_CICD_Fix(1).zip before running AWS."
                  )
          print("All required release files and CI adapters are present.")
          PY

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check fatal lint errors
        run: ruff check src cicd --select E9,F63,F7,F82

      - name: Run actual unit and mocked integration tests
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          mkdir -p artifacts
          python -m pytest tests -v \
            --junitxml=artifacts/pytest-results.xml \
            --cov=src \
            --cov=cicd \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=term-missing

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: ignore
          overwrite: true

  data_upload:
    name: 1 - Upload raw datasets to S3
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Validate AWS secret availability
        env:
          LAB_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          LAB_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAB_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          mapping = {
              "LAB_ACCESS_KEY": "AWS_ACCESS_KEY_ID",
              "LAB_SECRET_KEY": "AWS_SECRET_ACCESS_KEY",
              "LAB_SESSION_TOKEN": "AWS_SESSION_TOKEN",
          }
          missing = [secret for key, secret in mapping.items()
                     if not os.environ.get(key, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub AWS secrets: " + ", ".join(missing))
          print("Required credential values are present; authentication follows.")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify authenticated AWS account
        run: |
          python - <<'PY'
          import os
          import boto3
          identity = boto3.client("sts", region_name=os.environ["AWS_REGION"]).get_caller_identity()
          if identity["Account"] != os.environ["AWS_ACCOUNT_ID"]:
              raise SystemExit("Authenticated to an unexpected AWS account")
          print("AWS authentication succeeded for the expected account.")
          PY

      - name: Upload repository raw data
        run: python -m src.aws.sagemaker.data_upload

      - name: Verify uploaded main dataset
        run: |
          python - <<'PY'
          import os
          import boto3
          from urllib.parse import urlparse
          uri = urlparse(os.environ["RAW_DATA_URI"])
          obj = boto3.client("s3", region_name=os.environ["AWS_REGION"]).head_object(
              Bucket=uri.netloc, Key=uri.path.lstrip("/"))
          if obj["ContentLength"] <= 0:
              raise SystemExit("Uploaded raw dataset is empty")
          print("Raw S3 dataset verified:", obj["ContentLength"], "bytes")
          PY

  feature_store:
    name: 2 - Create or synchronize Feature Store
    needs: data_upload
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Validate AWS secret availability
        env:
          LAB_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          LAB_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAB_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          mapping = {
              "LAB_ACCESS_KEY": "AWS_ACCESS_KEY_ID",
              "LAB_SECRET_KEY": "AWS_SECRET_ACCESS_KEY",
              "LAB_SESSION_TOKEN": "AWS_SESSION_TOKEN",
          }
          missing = [secret for key, secret in mapping.items()
                     if not os.environ.get(key, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub AWS secrets: " + ", ".join(missing))
          print("Required credential values are present; authentication follows.")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify authenticated AWS account
        run: |
          python - <<'PY'
          import os
          import boto3
          identity = boto3.client("sts", region_name=os.environ["AWS_REGION"]).get_caller_identity()
          if identity["Account"] != os.environ["AWS_ACCOUNT_ID"]:
              raise SystemExit("Authenticated to an unexpected AWS account")
          print("AWS authentication succeeded for the expected account.")
          PY

      - name: Run Feature Store creation and ingestion
        run: python -m src.aws.sagemaker.feature_store

      - name: Save stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-store-results
          path: artifacts/feature_store.json
          if-no-files-found: ignore
          overwrite: true

  train:
    name: 3 - Prepare splits and run SageMaker training
    needs: feature_store
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Validate AWS secret availability
        env:
          LAB_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          LAB_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAB_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          mapping = {
              "LAB_ACCESS_KEY": "AWS_ACCESS_KEY_ID",
              "LAB_SECRET_KEY": "AWS_SECRET_ACCESS_KEY",
              "LAB_SESSION_TOKEN": "AWS_SESSION_TOKEN",
          }
          missing = [secret for key, secret in mapping.items()
                     if not os.environ.get(key, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub AWS secrets: " + ", ".join(missing))
          print("Required credential values are present; authentication follows.")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify authenticated AWS account
        run: |
          python - <<'PY'
          import os
          import boto3
          identity = boto3.client("sts", region_name=os.environ["AWS_REGION"]).get_caller_identity()
          if identity["Account"] != os.environ["AWS_ACCOUNT_ID"]:
              raise SystemExit("Authenticated to an unexpected AWS account")
          print("AWS authentication succeeded for the expected account.")
          PY

      - name: Verify training image reference
        run: |
          python - <<'PY'
          import os
          import boto3
          if os.environ.get("TRAINING_IMAGE_URI", "").strip():
              print("Using the explicitly configured framework image URI.")
          else:
              job = boto3.client("sagemaker", region_name=os.environ["AWS_REGION"]).describe_training_job(
                  TrainingJobName=os.environ["BASE_TRAINING_JOB_NAME"])
              if job["TrainingJobStatus"] != "Completed":
                  raise SystemExit("Reference training job must be Completed")
              print("Framework image:", job["AlgorithmSpecification"]["TrainingImage"])
          PY

      - name: Prepare S3 splits and train a new model
        run: python -m src.aws.sagemaker.training

      - name: Validate training artifact handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("artifacts/release.json").read_text())
          for key in ("training_job", "model_uri", "image"):
              if not state.get(key):
                  raise SystemExit("Training did not produce required state: " + key)
          print("Completed training job:", state["training_job"])
          print("New artifact:", state["model_uri"])
          PY

      - name: Save stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-train
          path: artifacts/release.json
          if-no-files-found: ignore
          overwrite: true

  evaluate:
    name: Evaluate held-out metrics and quality gates
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Validate AWS secret availability
        env:
          LAB_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          LAB_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAB_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          mapping = {
              "LAB_ACCESS_KEY": "AWS_ACCESS_KEY_ID",
              "LAB_SECRET_KEY": "AWS_SECRET_ACCESS_KEY",
              "LAB_SESSION_TOKEN": "AWS_SESSION_TOKEN",
          }
          missing = [secret for key, secret in mapping.items()
                     if not os.environ.get(key, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub AWS secrets: " + ", ".join(missing))
          print("Required credential values are present; authentication follows.")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify authenticated AWS account
        run: |
          python - <<'PY'
          import os
          import boto3
          identity = boto3.client("sts", region_name=os.environ["AWS_REGION"]).get_caller_identity()
          if identity["Account"] != os.environ["AWS_ACCOUNT_ID"]:
              raise SystemExit("Authenticated to an unexpected AWS account")
          print("AWS authentication succeeded for the expected account.")
          PY

      - name: Download exact upstream release state
        uses: actions/download-artifact@v4
        with:
          name: state-train
          path: artifacts

      - name: Evaluate the new artifact and enforce thresholds
        run: python -m cicd.release evaluate

      - name: Save stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-evaluate
          path: artifacts/release.json
          if-no-files-found: ignore
          overwrite: true

  register:
    name: 4 - Register evaluated model version
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Validate AWS secret availability
        env:
          LAB_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          LAB_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAB_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          mapping = {
              "LAB_ACCESS_KEY": "AWS_ACCESS_KEY_ID",
              "LAB_SECRET_KEY": "AWS_SECRET_ACCESS_KEY",
              "LAB_SESSION_TOKEN": "AWS_SESSION_TOKEN",
          }
          missing = [secret for key, secret in mapping.items()
                     if not os.environ.get(key, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub AWS secrets: " + ", ".join(missing))
          print("Required credential values are present; authentication follows.")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify authenticated AWS account
        run: |
          python - <<'PY'
          import os
          import boto3
          identity = boto3.client("sts", region_name=os.environ["AWS_REGION"]).get_caller_identity()
          if identity["Account"] != os.environ["AWS_ACCOUNT_ID"]:
              raise SystemExit("Authenticated to an unexpected AWS account")
          print("AWS authentication succeeded for the expected account.")
          PY

      - name: Download exact upstream release state
        uses: actions/download-artifact@v4
        with:
          name: state-evaluate
          path: artifacts

      - name: Register model pending approval
        run: python -m src.aws.sagemaker.model_registry

      - name: Save stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-register
          path: artifacts/release.json
          if-no-files-found: ignore
          overwrite: true

  deploy:
    name: 5 - Approve, validate staging and deploy production
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: cicd/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r cicd/requirements-ci.txt

      - name: Validate AWS secret availability
        env:
          LAB_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          LAB_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAB_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          mapping = {
              "LAB_ACCESS_KEY": "AWS_ACCESS_KEY_ID",
              "LAB_SECRET_KEY": "AWS_SECRET_ACCESS_KEY",
              "LAB_SESSION_TOKEN": "AWS_SESSION_TOKEN",
          }
          missing = [secret for key, secret in mapping.items()
                     if not os.environ.get(key, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub AWS secrets: " + ", ".join(missing))
          print("Required credential values are present; authentication follows.")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify authenticated AWS account
        run: |
          python - <<'PY'
          import os
          import boto3
          identity = boto3.client("sts", region_name=os.environ["AWS_REGION"]).get_caller_identity()
          if identity["Account"] != os.environ["AWS_ACCOUNT_ID"]:
              raise SystemExit("Authenticated to an unexpected AWS account")
          print("AWS authentication succeeded for the expected account.")
          PY

      - name: Download exact upstream release state
        uses: actions/download-artifact@v4
        with:
          name: state-register
          path: artifacts

      - name: Approve package, test staging and promote production
        run: python -m src.aws.sagemaker.deployment

      - name: Record deployment resource identifiers
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path("artifacts/release.json").read_text())
          if state.get("release_status") != "success":
              raise SystemExit("Production release has not reported success")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## AWS deployment resources\n\n")
              for key in ("training_job", "model_uri", "package_arn",
                          "production_endpoint", "prod_config", "alarm", "release_status"):
                  summary.write(f"- {key}: `{state.get(key, 'not recorded')}`\n")
          PY

      - name: Always clean this release's staging resources
        if: always()
        run: |
          if [ -f artifacts/release.json ]; then
            python -m cicd.release cleanup
          fi

      - name: Save stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-deploy
          path: artifacts/release.json
          if-no-files-found: ignore
          overwrite: true

  outcome:
    name: Report actual pipeline outcome
    needs: [checks, data_upload, feature_store, train, evaluate, register, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write job results and preserve failure status
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| Job | Actual result |\n|---|---|\n")
              for name, value in results.items():
                  summary.write(f"| {name} | {value['result']} |\n")
          if any(value["result"] in ("failure", "cancelled") for value in results.values()):
              raise SystemExit("Pipeline failed; inspect the failed job and saved artifacts.")
          PY
