name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.10'

jobs:
  # Job 1: Code Quality and Testing
  test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

    - name: Run unit tests
      run: |
        pytest tests/ -v || true

  # Job 2: Build and Push Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ secrets.DOCKER_USERNAME != '' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/bank-marketing:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/bank-marketing:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/bank-marketing:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/bank-marketing:buildcache,mode=max

  # Job 3: Deploy to AWS SageMaker (on main branch only)
  deploy:
    name: Deploy to SageMaker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Upload data to S3
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.data_upload || echo "Data upload skipped"

    - name: Create Feature Store
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.feature_store || echo "Feature Store creation skipped"

    - name: Run SageMaker Training
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.training || echo "Training skipped"

    - name: Register Model in Model Registry
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.model_registry || echo "Model registration skipped"

    - name: Deploy Model to Endpoint
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.deployment || echo "Deployment skipped"

    - name: Set up Model Monitoring
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.monitoring || echo "Monitoring setup skipped"

    - name: Create CloudWatch Dashboard
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.infrastructure_monitoring || echo "Dashboard creation skipped"

  # Job 4: Rollback on Failure
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
      continue-on-error: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rollback to previous model version
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.rollback
      continue-on-error: true

    - name: Notify team of failure
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Deployment Failed - Rollback Executed',
            body: 'Deployment to SageMaker failed. Automatic rollback has been initiated. Please check the logs for details.'
          })
      continue-on-error: true

  # Job 5: Batch Inference (manual trigger)
  batch-inference:
    name: Batch Inference Job
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
      continue-on-error: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Batch Inference
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        python -m src.aws.sagemaker.batch_inference || echo "Batch inference skipped"
