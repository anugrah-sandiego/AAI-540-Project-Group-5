name: Group 5 CI/CD AWS 

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      outcome:
        description: 'Simulation outcome (no AWS code is executed)'
        required: true
        type: choice
        options:
          - success
          - failure
        default: success

permissions:
  contents: read

concurrency:
  group: group5-simulation-${{ github.ref }}
  cancel-in-progress: false

env:
  SIMULATION_OUTCOME: ${{ inputs.outcome || 'success' }}

jobs:
  data_upload:
    name: 'SIMULATION 1 - S3 data upload'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate data upload for 60 seconds
        run: |
          echo "SIMULATION ONLY: no AWS calls or Python modules are executed."
          echo "Represented command: python -m src.aws.sagemaker.data_upload"
          sleep 60
          echo "Simulated data upload completed."

  feature_store:
    name: 'SIMULATION 2 - Feature Store'
    needs: data_upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate Feature Store for 60 seconds
        run: |
          echo "SIMULATION ONLY: no feature group is created or populated."
          echo "Represented command: python -m src.aws.sagemaker.feature_store"
          sleep 60
          echo "Simulated Feature Store stage completed."

  training:
    name: 'SIMULATION 3 - Model training'
    needs: feature_store
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate training for 60 seconds
        run: |
          echo "SIMULATION ONLY: no model is trained."
          echo "Represented command: python -m src.aws.sagemaker.training"
          sleep 60
          echo "Simulated training completed."

  model_registry:
    name: 'SIMULATION 4 - Model registration'
    needs: training
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate registration for 60 seconds
        run: |
          echo "SIMULATION ONLY: no model package is registered."
          echo "Represented command: python -m src.aws.sagemaker.model_registry"
          sleep 60
          echo "Simulated registration completed."

  deployment:
    name: 'SIMULATION 5 - Model deployment'
    needs: model_registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate deployment for 60 seconds
        run: |
          echo "SIMULATION ONLY: no endpoint is created or updated."
          echo "Represented command: python -m src.aws.sagemaker.deployment"
          sleep 60

      - name: Set the selected simulation result
        shell: bash
        run: |
          {
            echo "## Group 5 CI/CD simulation"
            echo ""
            echo "No AWS operations or project Python modules were executed."
            echo "Each of the five stages waited 60 seconds."
            echo "Selected simulation outcome: $SIMULATION_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$SIMULATION_OUTCOME" in
            success)
              echo "Simulation completed successfully."
              ;;
            failure)
              echo "::error::Intentional simulation failure selected. No AWS deployment was attempted."
              exit 1
              ;;
            *)
              echo "::error::Invalid simulation outcome. Choose success or failure."
              exit 1
              ;;
          esac
