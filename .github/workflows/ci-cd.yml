name: CI

# Every push and pull request: lint and test, then build the runtime image.
# On main the image is published to GitHub Container Registry, tagged with the
# commit. Deploying to AWS is done from a laptop with scripts/deploy.sh (docs/aws.md):
# AWS Academy credentials expire every few hours, so GitHub holds no AWS keys.

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  IMAGE: ghcr.io/${{ github.repository_owner }}/aai540-bank-marketing

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt pytest-cov==7.1.0 flake8==7.4.1
      - name: Lint (syntax errors and undefined names fail the build)
        run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Tests
        run: pytest tests -q --cov=src --cov-report=term-missing

  aws-test:
    name: aws-tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-aws.txt
      - run: pytest tests/aws -q

  build:
    name: Build runtime image
    needs: [ test, aws-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          # Same plain linux/amd64 image as scripts/deploy.sh builds for SageMaker
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
